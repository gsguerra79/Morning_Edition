name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run unit and baseline regression tests
        working-directory: newspaper
        run: python -m unittest -v
      - name: Byte-compile the Python modules
        working-directory: newspaper
        run: python -m py_compile server.py pipeline.py settings.py corpus_archive.py editions.py editorial_registry.py scripts/sync-editorial-registry.py
      - name: Validate the seed JSON
        working-directory: newspaper
        run: |
          python - <<'PY'
          import json
          for f in ("feeds.sample.json", "categories.sample.json", "editorial-adapters.sample.json"):
              json.load(open(f))
              print(f, "ok")
          PY
      - name: Validate Compose definitions
        working-directory: newspaper
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.shadow.yaml config --quiet

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the container image
        run: docker build -t morning-edition:ci newspaper
